<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Monitoring Unloading Warehouse</title>
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<style>
/* ============ TOKENS ============ */
:root{
  --bg:#f1f5f9; --card:#ffffff; --field:#ffffff;
  --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --primary:#2563eb; --primary-d:#1d4ed8; --primary-soft:#eff6ff;
  --ok:#16a34a; --warn:#d97706; --bad:#dc2626;
  --sched:#64748b; --tiba:#0284c7; --work:#d97706; --done:#16a34a; --cancel:#dc2626;
  --dark:#0f172a; --dark2:#1e293b; --dark-ink:#e2e8f0; --dark-mut:#94a3b8;
  --soft:#f8fafc; --seg:#e2e8f0; --kcol:#e8edf3; --kh-ink:#334155;
  --err-bg:#fef2f2; --err-line:#fecaca;
  --p-g-bg:#dcfce7; --p-b-bg:#dbeafe;
  --shadow:0 1px 3px rgba(15,23,42,.12);
  --shadow-up:0 4px 14px rgba(15,23,42,.10);
  --r:12px;
}
[data-theme="dark"]{
  --bg:#0b1220; --card:#111a2c; --field:#0e1626;
  --ink:#e2e8f0; --muted:#8aa0b8; --line:#22304a;
  --primary:#3b82f6; --primary-d:#2563eb; --primary-soft:#12233f;
  --soft:#16223a; --seg:#1a2740; --kcol:#16223a; --kh-ink:#9fb3cd;
  --err-bg:#2a1414; --err-line:#5c2020;
  --p-g-bg:#12301f; --p-b-bg:#152a45;
  --shadow:0 1px 3px rgba(0,0,0,.4);
  --shadow-up:0 4px 14px rgba(0,0,0,.45);
}
[data-theme="dark"] .badge{opacity:.95}
[data-theme="dark"] .tbtn{background:#1a2740;color:#cbd5e1}
[data-theme="dark"] input,[data-theme="dark"] select,[data-theme="dark"] textarea{background:var(--field)}
[data-theme="dark"] .btn.sec{background:#22304a;color:var(--ink)}

/* ============ BASE ============ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:15px;transition:background .25s,color .25s}
button{font-family:inherit;cursor:pointer;border:none;border-radius:9px;font-weight:600}
input,select,textarea{font-family:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;width:100%;background:var(--field);color:var(--ink);transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary);outline-offset:-1px;border-color:transparent}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
label .helper{font-weight:500;color:var(--muted);opacity:.75}
.hide{display:none!important}
.tnum{font-variant-numeric:tabular-nums}
.ic{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-0.135em;flex-shrink:0}
.ic.lg{width:1.35em;height:1.35em}

/* ============ LOGIN ============ */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px;background:linear-gradient(160deg,var(--dark) 0%,#1e3a5f 100%)}
.login-card{background:var(--card);border-radius:16px;padding:26px 22px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.login-logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px;color:var(--primary)}
.login-logo .ic{width:34px;height:34px;stroke-width:1.8}
.login-card h1{font-size:20px;font-weight:800;text-align:center;margin-bottom:2px;letter-spacing:-.2px}
.login-card p.sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:16px}
.btn{padding:11px 16px;background:var(--primary);color:#fff;width:100%;font-size:15px;margin-top:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:filter .15s,transform .1s}
.btn:hover:not(:disabled){filter:brightness(1.07)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:default}
.btn.sec{background:var(--seg);color:var(--ink)}
.btn.danger{background:var(--bad)}
.btn.small{width:auto;padding:7px 12px;font-size:13px;margin-top:0}
details.urlbox{margin-bottom:6px}
details.urlbox summary{cursor:pointer;font-size:13px;color:var(--primary);font-weight:600}
.err-msg{background:var(--err-bg);color:var(--bad);border:1px solid var(--err-line);padding:9px 12px;border-radius:9px;font-size:13px;margin-top:12px}

/* ============ TOPBAR ============ */
header.top{position:sticky;top:0;z-index:40;background:var(--dark);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 14px}
header.top .ttl{font-weight:700;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:7px}
header.top .ttl .ic{color:var(--tiba);width:18px;height:18px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex-shrink:0}
.dot.off{background:var(--bad)}
.tbtn{background:var(--dark2);color:var(--dark-ink);padding:8px 11px;font-size:13px;border-radius:8px;flex-shrink:0;display:inline-flex;align-items:center;gap:6px;transition:background .15s}
.tbtn:hover{background:#2b3b57}
.tbtn.active{background:var(--primary);color:#fff}

/* ============ TABS ============ */
nav.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:49px;z-index:39}
nav.tabs button{flex:1;background:none;color:var(--muted);padding:11px 4px;font-size:13px;font-weight:600;border-bottom:3px solid transparent;border-radius:0;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:color .15s,border-color .15s}
nav.tabs button.on{color:var(--primary);border-bottom-color:var(--primary)}
main{max-width:1180px;margin:0 auto;padding:14px 12px 90px}
body[data-mode="monitor"] main{max-width:none;padding-bottom:20px}
section[id^="view"]:not(.hide){animation:viewIn .18s ease}
@keyframes viewIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* ============ QUEUE CARDS ============ */
.cols{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){.cols{grid-template-columns:repeat(4,1fr)}}
.col-h{display:flex;align-items:center;gap:7px;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:4px 4px 8px}
.col-h .ic{width:15px;height:15px}
.col-h .n{background:var(--seg);color:var(--muted);border-radius:99px;padding:1px 8px;font-size:12px;font-variant-numeric:tabular-nums}
.trk{position:relative;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 12px 12px 17px;margin-bottom:10px;overflow:hidden;transition:transform .15s,box-shadow .15s}
.trk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--sched)}
.trk.st-Tiba::before{background:var(--tiba)}
.trk.st-SedangBongkar::before{background:var(--work)}
.trk.st-Selesai::before{background:var(--done)}
.trk.st-Dibatalkan::before{background:var(--cancel)}
.trk.st-Dibatalkan{opacity:.65}
.trk:hover{transform:translateY(-1px);box-shadow:var(--shadow-up)}
.trk.late{animation:pulseRed 1.6s infinite}
@keyframes pulseRed{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.45)}50%{box-shadow:0 0 0 5px rgba(220,38,38,.12)}}
.trk .row1{display:flex;align-items:center;gap:8px}
.trk .plate{font-weight:800;font-size:17px;letter-spacing:.5px;flex:1;font-variant-numeric:tabular-nums}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;color:#fff;white-space:nowrap}
.bg-sched{background:var(--sched)}.bg-tiba{background:var(--tiba)}.bg-work{background:var(--work)}.bg-done{background:var(--done)}.bg-cancel{background:var(--cancel)}.bg-gray{background:#94a3b8}
.trk .meta{color:var(--muted);font-size:13px;margin-top:5px;line-height:1.6}
.trk .meta b{color:var(--ink)}
.trk .meta .mic{width:13px;height:13px;vertical-align:-2px;margin-right:2px;opacity:.85}
.trk .timer{font-size:13px;font-weight:700;margin-top:6px;color:var(--primary);display:flex;align-items:center;gap:5px;font-variant-numeric:tabular-nums}
.trk .timer.hot{color:var(--bad)}
.trk .acts{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.trk .acts button{flex:1;padding:9px 6px;font-size:13px;min-width:100px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.a-blue{background:var(--tiba);color:#fff}.a-amber{background:var(--work);color:#fff}
.a-green{background:var(--ok);color:#fff}.a-red{background:var(--bad);color:#fff}
.a-gray{background:var(--seg);color:var(--ink)}
.empty{color:var(--muted);text-align:center;padding:30px 10px;font-size:14px}

/* ============ PANEL / FORM / DASHBOARD ============ */
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.panel h2{font-size:16px;margin-bottom:4px}
.panel p.hint{font-size:13px;color:var(--muted);margin-bottom:8px}
.seg{display:flex;background:var(--seg);border-radius:9px;padding:4px;margin-bottom:6px}
.seg button{flex:1;background:none;color:var(--muted);padding:8px;border-radius:7px;font-size:14px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
@media(min-width:720px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:12px;text-align:center}
.stat .v{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
.stat.warn .v{color:var(--warn)}.stat.bad .v{color:var(--bad)}.stat.ok .v{color:var(--ok)}

/* trend chart */
.trend{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:6px}
.trend .bar-w{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.trend .bar-v{font-size:11px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1}
.trend .bar{width:100%;max-width:46px;border-radius:5px 5px 0 0;background:linear-gradient(180deg,var(--primary) 0%,var(--primary-d) 100%);min-height:3px;transition:height .3s ease}
.trend .bar-l{font-size:10px;color:var(--muted);white-space:nowrap;line-height:1}

.tbl{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border-radius:var(--r)}
.tbl th{background:var(--dark2);color:#fff;text-align:left;padding:9px 10px;font-size:12px;white-space:nowrap;position:sticky;top:0;z-index:2}
.tbl td{padding:8px 10px;border-top:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl tr:nth-child(even) td{background:var(--soft)}
.scroll-x{overflow-x:auto;border-radius:var(--r);box-shadow:var(--shadow)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select{width:auto;min-width:130px;flex:1}
.filters .btn.small{align-self:stretch;display:flex;align-items:center}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.subnav button{background:var(--seg);color:var(--muted);padding:7px 13px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.subnav button.on{background:var(--primary);color:#fff}
.list-row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:14px;flex-wrap:wrap}
.list-row:last-child{border-bottom:none}
.list-row .grow{flex:1;min-width:120px}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--seg);color:var(--muted)}
.pill.g{background:var(--p-g-bg);color:var(--ok)}.pill.r{background:var(--err-bg);color:var(--bad)}.pill.b{background:var(--p-b-bg);color:var(--tiba)}

/* ============ MONITOR DESKTOP ============ */
.mon-head{display:flex;align-items:center;gap:18px;background:var(--dark);border-radius:var(--r);padding:14px 20px;color:#fff;margin-bottom:14px;flex-wrap:wrap}
#bigClock{font-size:42px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px;line-height:1}
.mon-head .dt{color:var(--dark-mut);font-size:14px;font-weight:600}
.mon-head .sp{flex:1}
.rf{font-size:12px;color:var(--dark-mut)}
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:1023px){.kanban{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.kanban{grid-template-columns:1fr}}
.kcol{background:var(--kcol);border-radius:var(--r);padding:10px;min-height:120px}
.kcol .kh{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;display:flex;justify-content:space-between;padding:2px 4px 8px;color:var(--kh-ink)}
.kcol .kh .ic{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.kcard{position:relative;background:var(--card);border-radius:10px;padding:10px 10px 10px 14px;margin-bottom:8px;box-shadow:var(--shadow);overflow:hidden}
.kcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sched)}
.kcard.c1::before{background:var(--tiba)}.kcard.c2::before{background:var(--work)}.kcard.c3::before{background:var(--done)}
.kcard.late{animation:pulseRed 1.6s infinite}
.kcard .p{font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.kcard .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kcard .t{font-size:13px;font-weight:700;color:var(--primary);margin-top:4px;font-variant-numeric:tabular-nums}
.kcard .t.hot{color:var(--bad)}
.kcard .ops{font-size:11px;color:var(--muted);margin-top:4px}
details.tbl-wrap{margin-top:14px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
details.tbl-wrap summary{cursor:pointer;font-weight:700;padding:13px 16px;font-size:14px;display:flex;align-items:center;gap:8px}
details.tbl-wrap .inner{padding:0 14px 14px}
.maxh{max-height:420px;overflow:auto}

/* ============ MODAL & TOAST ============ */
#modalOverlay{position:fixed;inset:0;background:rgba(5,10,20,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);color:var(--ink);border-radius:16px;width:100%;max-width:420px;padding:20px;max-height:88vh;overflow-y:auto;animation:viewIn .18s ease}
.modal h3{font-size:17px;margin-bottom:4px}
.modal .msub{font-size:13px;color:var(--muted);margin-bottom:6px}
.mfoot{display:flex;gap:9px;margin-top:16px}
.mfoot button{flex:1;padding:11px}
.radio-set{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.radio-set label.rdo{display:flex;gap:9px;align-items:center;font-weight:500;color:var(--ink);font-size:14px;margin:0;background:var(--soft);border:1px solid var(--line);padding:9px 11px;border-radius:9px;cursor:pointer}
.radio-set label.rdo.sel{border-color:var(--primary);background:var(--primary-soft)}
.radio-set input{width:auto}
#toastWrap{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:200;display:flex;flex-direction:column;gap:8px;width:min(92vw,420px)}
.toast{background:var(--dark2);color:#fff;padding:12px 16px;border-radius:11px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.3);display:flex;gap:10px;align-items:center;animation:pop .25s;border-left:4px solid var(--tiba)}
.toast.err{background:var(--bad);border-left-color:rgba(255,255,255,.5)}
.toast.ok{background:var(--ok);border-left-color:rgba(255,255,255,.5)}
.toast .ic{width:17px;height:17px;flex-shrink:0}
.toast button.retry{background:rgba(255,255,255,.2);color:#fff;padding:6px 12px;font-size:12px;flex-shrink:0}
@keyframes pop{from{opacity:0;transform:translateY(12px)}to{opacity:1}}

.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* skeleton */
.skel{height:64px;border-radius:var(--r);margin-bottom:10px;background:linear-gradient(90deg,var(--soft) 25%,var(--line) 37%,var(--soft) 63%);background-size:400% 100%;animation:shimmer 1.3s infinite}
.skel.thin{height:36px}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}

footer.cred{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:8px 14px;display:flex;align-items:center;gap:10px;z-index:45}
footer.cred .who{flex:1;font-size:13px}
footer.cred .who b{display:block;font-size:14px}
footer.cred .who span{color:var(--muted);font-size:12px}
body[data-mode="monitor"] footer.cred{display:none}

/* ============ RESPONSIVE <600px ============ */
@media(max-width:599px){
  .cols,.kanban,.stats{grid-template-columns:1fr!important}
  .tbl th,.tbl td{font-size:12px;padding:6px 8px}
  .col-opt{display:none}
  .trk{padding:10px 10px 10px 15px;margin-bottom:8px}
  .trk .plate{font-size:15px}
  .badge{font-size:10px;padding:2px 6px}
  .acts button{min-width:auto;padding:8px;font-size:12px}
  .empty{padding:20px 10px;font-size:12px}
  .kcol{padding:8px}.kcard{padding:8px 8px 8px 12px}
  .stat .v{font-size:20px}
  .subnav button{font-size:12px;padding:6px 10px}
  .list-row{font-size:13px;padding:8px 2px}
  .maxh{max-height:300px}
  nav.tabs{top:46px}
  header.top{padding:9px 10px}
  header.top .ttl{font-size:14px}
  .tbtn{padding:7px 9px}
  .mon-head{gap:10px;padding:12px 14px}
  #bigClock{font-size:32px}
}

/* ============ REDUCED MOTION ============ */
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
  .trk.late,.kcard.late{animation:none;box-shadow:0 0 0 2px var(--bad)}
  .skel{animation:none;opacity:.7}
}
</style>
</head>

<script>
'use strict';
/* ================= KONFIG & STATE ================= */
var LS = { URL:'unl_url', USER:'unl_user', PASS:'unl_pass', MODE:'unl_mode' };
var SATUAN_OPTS = ['Pallet','Palet','Bags','box','Dus','Drum','pcs','tanki','Pail','Roll','Unit','Lainnya'];
var TEMUAN_FALLBACK = ['TIDAK ADA (NORMAL)','Actual tidak sama dengan surat jalan','Barang rusak','Kemasan rusak / bocor','Dokumen tidak lengkap','Lainnya'];
var ST_LIST = ['Dijadwalkan','Tiba','Sedang Bongkar','Selesai','Dibatalkan'];
var ST_CLS = {'Dijadwalkan':'bg-sched','Tiba':'bg-tiba','Sedang Bongkar':'bg-work','Selesai':'bg-done','Dibatalkan':'bg-cancel'};
var ST_BORD = {'Dijadwalkan':'','Tiba':'st-Tiba','Sedang Bongkar':'st-SedangBongkar','Selesai':'st-Selesai','Dibatalkan':'st-Dibatalkan'};

var S = {
  me:null, cred:{u:'',p:''}, settings:{}, suppliers:[], operators:[],
  visits:[], users:[], audit:[], temuanOpts:TEMUAN_FALLBACK,
  jumlahDock:3, serverDelta:0,
  mode:'operasi', tab:'queue', sumber:'walkin', adminTab:'users',
  refreshTimer:null, clockTimer:null, tickTimer:null, rfCount:0, spinning:false,
  knownIds:null, lateSet:new Set(), firstLoad:true,
  fDash:{date:'',vendor:'',status:''}, fMon:{date:'',vendor:'',status:''},
  lastUpdate:null, audioCtx:null
};

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function pad2(n){ return n<10?'0'+n:''+n; }
function ic(n,c){ return '<svg class="ic'+(c?' '+c:'')+'" aria-hidden="true"><use href="#i-'+n+'"/></svg>'; }

/* ================= TEMA ================= */
var THEME_KEY='unl_theme';
function themePref(){
  var t=localStorage.getItem(THEME_KEY);
  if(!t) t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
  return t;
}
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  var b=$('btnTheme');
  if(b){ b.innerHTML=ic(t==='dark'?'sun':'moon'); b.title=(t==='dark'?'Mode terang':'Mode gelap'); }
}
applyTheme(themePref());

/* ================= WAKTU ================= */
function nowMs(){ return Date.now()+S.serverDelta; }
function ymdJak(ms){ var d=new Date(ms+7*3600000); return d.toISOString().slice(0,10); }
function todayJak(){ return ymdJak(nowMs()); }
function fmtHM(iso){ if(!iso)return '-'; try{return new Date(iso).toLocaleTimeString('id-ID',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit'});}catch(e){return '-';} }
function fmtDT(iso){ if(!iso)return '-'; var d=new Date(iso); try{return d.toLocaleDateString('id-ID',{timeZone:'Asia/Jakarta',day:'2-digit',month:'short'})+' '+fmtHM(iso);}catch(e){return '-';} }
function minsSince(iso,base){ if(!iso)return null; var ms=base-nowMsOf(iso); return Math.floor(ms/60000); }
function nowMsOf(iso){ return Date.parse(iso)||Date.now(); }
function durStr(m){ if(m==null)return '-'; var h=Math.floor(m/60), r=m%60; return h>0 ? h+'j '+pad2(r)+'m' : r+' mnt'; }

/* ================= API ================= */
function apiUrl(action,params){
  var base = localStorage.getItem(LS.URL)||'';
  var q = '?action='+encodeURIComponent(action);
  Object.keys(params||{}).forEach(function(k){ if(params[k]!==''&&params[k]!=null) q+='&'+encodeURIComponent(k)+'='+encodeURIComponent(params[k]); });
  q += '&username='+encodeURIComponent(S.cred.u)+'&password='+encodeURIComponent(S.cred.p);
  return base+q;
}
function handleServerDelta(j){ if(j&&j.server_time){ var st=Date.parse(j.server_time); if(!isNaN(st)) S.serverDelta=st-Date.now(); } }
function authFail(msg){ return String(msg||'').indexOf('AUTH:')===0; }

async function callFetch(url,opt){
  var res = await fetch(url,opt);
  var j = await res.json();
  handleServerDelta(j);
  if(!j.ok) throw new Error(j.error||'Kesalahan server');
  return j;
}
async function apiGet(action,params){
  if(!localStorage.getItem(LS.URL)) throw new Error('URL Web App belum diisi.');
  return callFetch(apiUrl(action,params),{method:'GET',redirect:'follow'});
}
async function apiPost(action,payload){
  var base = localStorage.getItem(LS.URL);
  if(!base) throw new Error('URL Web App belum diisi.');
  var body = {action:action};
  Object.keys(payload||{}).forEach(function(k){ body[k]=payload[k]; });
  body.username=S.cred.u; body.password=S.cred.p;
  return callFetch(base,{method:'POST',redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(body)});
}
async function apiLogin(u,p){
  var base = localStorage.getItem(LS.URL);
  if(!base) throw new Error('URL Web App belum diisi. Klik "URL Web App" di atas.');
  var res = await fetch(base,{method:'POST',redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:'login',username:u,password:p})});
  var j = await res.json();
  if(!j.ok) throw new Error(j.error||'Login gagal');
  handleServerDelta(j);
  return j.data;
}

/* ================= TOAST & MODAL ================= */
function toast(msg,type,retryCb){
  var t=document.createElement('div');
  t.className='toast'+(type==='err'?' err':type==='ok'?' ok':'');
  var icon=type==='err'?ic('alert'):type==='ok'?ic('check-c'):ic('clock');
  t.innerHTML=icon+'<span style="flex:1">'+esc(msg)+'</span>';
  if(retryCb){ var b=document.createElement('button'); b.className='retry'; b.textContent='↳ Coba Lagi';
    b.onclick=function(){ t.remove(); retryCb(); }; t.appendChild(b); }
  $('toastWrap').appendChild(t);
  setTimeout(function(){ t.remove(); }, retryCb?12000:3200);
}
function openModal(title,sub,bodyHtml,onMount,actions){
  var box=$('modalBox');
  box.innerHTML='<h3>'+esc(title)+'</h3>'+(sub?'<div class="msub">'+esc(sub)+'</div>':'')+
    '<div id="mBody">'+bodyHtml+'</div><div class="mfoot" id="mFoot"></div>';
  var foot=$('mFoot');
  (actions||[{label:'Tutup',cls:'sec'}]).forEach(function(a){
    var b=document.createElement('button');
    b.className='btn '+(a.cls||'sec'); b.style.marginTop='0'; b.textContent=a.label;
    b.onclick=function(){ if(a.onClick){ a.onClick(box); } else closeModal(); };
    foot.appendChild(b);
  });
  $('modalOverlay').classList.remove('hide');
  if(onMount) onMount(box);
}
function closeModal(){ $('modalOverlay').classList.add('hide'); $('modalBox').innerHTML=''; }
function confirmDialog(msg,cb,danger){
  openModal('Konfirmasi','', '<p style="font-size:14px">'+esc(msg)+'</p>',null,
    [{label:'Ya, Lanjut',cls:danger?'danger':'',onClick:function(){closeModal();cb();}},
     {label:'Batal',cls:'sec'}]);
}

/* ================= LOGIN FLOW ================= */
function showLogin(errMsg){
  $('appScreen').classList.add('hide'); $('loginScreen').classList.remove('hide');
  stopAllTimers();
  if(errMsg){ var e=$('loginErr'); e.textContent=errMsg; e.classList.remove('hide'); }
  var ub=$('urlBox'); if(!localStorage.getItem(LS.URL)) ub.open=true;
}
async function doLogin(u,p){
  var btn=$('btnLogin'); btn.disabled=true; btn.innerHTML='<span class="spin"></span> Masuk...';
  try{
    var data=await apiLogin(u,p);
    localStorage.setItem(LS.USER,u); localStorage.setItem(LS.PASS,p);
    S.cred={u:u,p:p}; S.me={username:data.username,nama:data.nama,role:data.role};
    S.temuanOpts=(data.temuan_options&&data.temuan_options.length)?data.temuan_options:TEMUAN_FALLBACK;
    enterApp();
  }catch(e){ showLogin(e.message.replace('AUTH: ','')); }
  finally{ btn.disabled=false; btn.textContent='Masuk'; }
}
function enterApp(){
  $('loginScreen').classList.add('hide'); $('appScreen').classList.remove('hide');
  $('loginErr').classList.add('hide');
  $('whoName').textContent=S.me.nama;
  $('whoRole').textContent='Role: '+S.me.role+(S.me.role==='SPB'?' (pantau)':'');
  $('tabAdmin').style.display = S.me.role==='ADMIN'?'':'none';
  document.querySelector('[data-tab="form"]').style.display = canAct()?'':'none';
  if(!canAct()&&S.tab==='form')S.tab='queue';
  if(!isAdmin()&&S.tab==='admin')S.tab='queue';
  setMode(localStorage.getItem(LS.MODE)||(window.innerWidth>=1024?'monitor':'operasi'));
  refreshData(false);

/* ================= DATA LOAD ================= */
async function refreshData(showSpin){
  if(!S.me) return;
  if(showSpin){ S.spinning=true; $('spinBox').innerHTML='<span class="spin"></span>'; }
  $('connDot').className='dot';
  try{
    var j=await apiGet('bootstrap',{});
    var d=j.data||{};
    S.visits=d.visits||[]; S.suppliers=d.suppliers||[];
    S.settings=d.settings||{}; S.jumlahDock=Number(d.jumlah_dock)||3;
    S.lastUpdate=nowMs();
    detectEvents();
    renderAll();
    $('connDot').className='dot';
    S.firstLoad=false;
  }catch(e){
    $('connDot').className='dot off';
    if(authFail(e.message)){ forceLogout('Sesi berakhir: '+e.message.replace('AUTH: ','')); return; }
    toast('Gagal memuat data: '+e.message,'err',function(){ refreshData(true); });
  }finally{
    S.spinning=false; $('spinBox').innerHTML='';
  }
}
function detectEvents(){
  var parah=Number(S.settings['threshold_telat_parah_menit'])||60;
  var seen={}, now=nowMs();
  S.visits.forEach(function(v){
    if(v.status==='Tiba'){
      var w=minsSince(v.aktual_tiba,now);
      if(w!=null&&w>=parah&&!S.lateSet.has(v.kode_kedatangan)){
        S.lateSet.add(v.kode_kedatangan);
        if(!S.firstLoad&&S.mode==='monitor'){ beep(); setTimeout(beep,260); toast(v.no_polisi+' menunggu '+durStr(w)+'!','err'); }
      }
    }
    if(!S.firstLoad&&S.mode==='monitor'&&v.status==='Tiba'&&ymdJak(nowMsOf(v.aktual_tiba||v._ts_iso))===todayJak()){
      if(S.knownIds&&!S.knownIds.has(v.kode_kedatangan)){ beep(); }
    }
    seen[v.kode_kedatangan]=1;
  });
  S.knownIds=S.knownIds||new Set();
  Object.keys(seen).forEach(function(id){ S.knownIds.add(id); });
}

/* ================= TIMERS ================= */
function startTimers(){
  stopAllTimers();
  scheduleRefresh();
  S.clockTimer=setInterval(function(){
    if(S.mode==='monitor'){ $('bigClock').textContent=jktTime(nowMs()); $('bigDate').textContent=jktDate(nowMs()); }
  },1000);
  if(S.mode==='monitor'){ $('bigClock').textContent=jktTime(nowMs()); $('bigDate').textContent=jktDate(nowMs()); }
  S.tickTimer=setInterval(tickRunning,15000);
  updateRfLabel();
  S.rfInt=setInterval(function(){ if(S.rfCount>0){S.rfCount--;updateRfLabel();} },1000);
}
function updateRfLabel(){ if($('rfLeft'))$('rfLeft').textContent=Math.max(0,S.rfCount); }
function scheduleRefresh(){
  if(S.refreshTimer)clearInterval(S.refreshTimer);
  var ms=S.mode==='monitor'?15000:30000;
  S.rfCount=ms/1000;
  S.refreshTimer=setInterval(function(){ if(!document.hidden)refreshData(true); },ms);
}
function stopAllTimers(){
  ['refreshTimer','clockTimer','tickTimer','rfInt'].forEach(function(k){ if(S[k]){clearInterval(S[k]);S[k]=null;} });
}
document.addEventListener('visibilitychange',function(){
  if(!document.hidden&&S.me){ refreshData(false); scheduleRefresh(); }
});
function jktTime(ms){ try{return new Date(ms).toLocaleTimeString('id-ID',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit',second:'2-digit'});}catch(e){return new Date(ms).toTimeString().slice(0,8);} }
function jktDate(ms){ try{return new Date(ms).toLocaleDateString('id-ID',{timeZone:'Asia/Jakarta',weekday:'long',day:'numeric',month:'long',year:'numeric'});}catch(e){return '';} }
function beep(){
  try{
    S.audioCtx=S.audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    var c=S.audioCtx; if(c.state==='suspended')c.resume();
    var o=c.createOscillator(),g=c.createGain();
    o.type='square'; o.frequency.value=880; o.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(.07,c.currentTime); o.start(); o.stop(c.currentTime+.16);
  }catch(e){}
}
function tickRunning(){
  document.querySelectorAll('[data-runstart]').forEach(function(elm){
    var b=elm.querySelector('b'); if(!b)return;
    var m=minsSince(elm.getAttribute('data-runstart'),nowMs());
    if(m!=null)b.textContent=durStr(Math.max(0,m));
  });
}

function todayVisits(){
  var td=todayJak();
  return S.visits.filter(function(v){
    var d=v.tanggal_kedatangan||v._ts_iso;
    return d&&ymdJak(nowMsOf(d))===td;
  });

function runningBongkarMin(v){
  if(v.status!=='Sedang Bongkar'||!v.mulai_bongkar)return null;
  var m=minsSince(v.mulai_bongkar,nowMs());
  var bs=v.break_start,be=v.break_end;
  if(bs&&!be){ var cur=minsSince(bs,nowMs()); m-=cur; }
  else if(bs&&be){ m-=(nowMsOf(be)-nowMsOf(bs))/60000; }
  return Math.max(0,Math.round(m));
}

async function actTruk(act,id,extra){
  if(S.busy){toast('Masih ada proses berjalan, tunggu sebentar...','');return;}
  S.busy=true;
  try{
    var payload={kode_kedatangan:id};
    if(extra)Object.keys(extra).forEach(function(k){payload[k]=extra[k];});
    await apiPost(act,payload);
    toast('Berhasil: '+act,'ok');
    await refreshData(true);
  }catch(e){
    if(authFail(e.message)){forceLogout(e.message.replace('AUTH: ',''));return;}
    toast(e.message,'err',function(){actTruk(act,id,extra);});
  }finally{S.busy=false;}
}

function computeStats(list){
  var st={total:list.length,Dijadwalkan:0,Tiba:0,'Sedang Bongkar':0,Selesai:0,Dibatalkan:0};
  var tw=[],tb=[],tepat=0,fin=0;
  var tpt=Number(S.settings['threshold_tepat_waktu_menit'])||15;
  var docks={};
  list.forEach(function(v){
    if(st[v.status]!==undefined)st[v.status]++;
    if(v.status==='Sedang Bongkar'&&v.dock)docks[v.dock]=1;
    if(v.status==='Selesai'){
      if(v.durasi_tunggu_menit!=null){tw.push(v.durasi_tunggu_menit);fin++;if(v.durasi_tunggu_menit<=tpt)tepat++;}
      if(v.durasi_bongkar_menit!=null)tb.push(v.durasi_bongkar_menit);
    }
  });
  var avg=function(a){return a.length?Math.round(a.reduce(function(x,y){return x+y;},0)/a.length):null;};
  return {counts:st,avgTunggu:avg(tw),avgBongkar:avg(tb),
    tepatPct:fin?Math.round(tepat/fin*100):null,dockUsed:Object.keys(docks).length};
}

    {l:'Rata-rata Tunggu',v:durStr(st.avgTunggu),c:st.avgTunggu>(Number(S.settings['threshold_telat_parah_menit'])||60)?'bad':''},
    {l:'Rata-rata Bongkar',v:durStr(st.avgBongkar),c:''},
    {l:'Tepat Waktu (≤'+(Number(S.settings['threshold_tepat_waktu_menit'])||15)+'m)',v:st.tepatPct==null?'-':st.tepatPct+'%',c:'ok'},
    {l:'Dock Terpakai',v:st.dockUsed+'/'+S.jumlahDock,c:''}
  ];
}

var TABLE_HEAD='<thead><tr><th>Tanggal</th><th>No. Polisi</th><th>Supplier</th><th>Jenis</th><th>Sumber</th><th>Plan</th><th>Tiba</th><th>Mulai</th><th>Selesai</th><th>Dock</th><th>Qty</th><th>Tunggu(m)</th><th>Bongkar(m)</th><th>Status</th><th>Op Tiba</th><th>Op Bongkar</th><th>Temuan</th></tr></thead>';
function tableHtml(list){
  if(!list.length)return TABLE_HEAD+'<tbody><tr><td colspan="17" style="text-align:center;color:var(--muted);padding:20px">Tidak ada data</td></tr></tbody>';

function byCreated(a,b){ return String(b._ts_iso||'').localeCompare(String(a._ts_iso||'')); }
function csvExport(list,name){
  var head=['Tanggal','No Polisi','Supplier','Jenis','Sumber','Plan Tiba','Aktual Tiba','Mulai Bongkar','Selesai Bongkar','Dock','QTY','Satuan','Durasi Tunggu (mnt)','Durasi Bongkar (mnt)','Status','Operator Tiba','Operator Bongkar','Temuan','Keterangan'];
  var rows=list.map(function(v){
    return [fmtDT(v.tanggal_kedatangan||v._ts_iso),v.no_polisi,v.vendor,v.jenis_transaksi,v.sumber,fmtHM(v.plan_tiba),fmtHM(v.aktual_tiba),fmtHM(v.mulai_bongkar),fmtHM(v.selesai_bongkar),v.dock,v.qty,v.satuan,v.durasi_tunggu_menit,v.durasi_bongkar_menit,v.status,v.operator_tiba,v.operator_bongkar,v.temuan,v.catatan];
  });
  var csv='\uFEFF'+[head].concat(rows).map(function(r){
    return r.map(function(c){c=String(c==null?'':c);return /[",;\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(';');
  }).join('\r\n');
  var blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
  toast('CSV diunduh','ok');
}

/**
 * Validasi form truck sebelum submit.
 * @returns {boolean} true jika valid
 */
function validateTruckForm(){
  var vendor=$('fVendor').value.trim();
  var pol=$('fPol').value.trim().toUpperCase();
  // Validasi supplier
  if(!vendor){$('fVendor').focus();toast('Pilih supplier dulu','err');return false;}
  // Validasi no polisi (format: B 1234 XYZ atau similar: huruf/angka/spasi, minimal 3 char)
  var platePattern = /^[A-Z0-9\s]{3,}$/;
  if(!pol){$('fPol').focus();toast('No. polisi wajib diisi','err');return false;}
  if(!platePattern.test(pol)){$('fPol').focus();toast('Format no. polisi tidak valid','err');return false;}
  // Validasi nama supir (opsional tapi jika diisi harus huruf/ruang)
  var supir=$('fSupir').value.trim();
  if(supir && !/^[A-Za-z\s]+$/.test(supir)){$('fSupir').focus();toast('Format nama supir tidak valid','err');return false;}
  // Validasi jenis transaksi
  var jenis=$('fJenis').value;
  if(!jenis){$('fJenis').focus();toast('Pilih jenis transaksi','err');return false;}
  // Validasi rencana tiba (jika jadwal)
  if(S.sumber==='jadwal'){
    if(!$('fPlan').value){$('fPlan').focus();toast('Isi rencana tiba','err');return false;}
  }
  return true;
}

async function submitTruck(){
  if(S.busy)return;
  if(!validateTruckForm())return;
  var vendor=$('fVendor').value,pol=$('fPol').value.trim().toUpperCase();
  var payload={vendor:vendor,no_polisi:pol,nama_supir:$('fSupir').value.trim(),no_po:$('fSJ').value.trim(),jenis_transaksi:$('fJenis').value,catatan:$('fCatatan').value.trim()};
  var btn=$('btnSubmitTruck');
  S.busy=true;btn.disabled=true;
  try{
    if(S.sumber==='jadwal'){
      if(!$('fPlan').value){toast('Isi rencana tiba','err');return;}
      payload.plan_tiba=new Date($('fPlan').value).toISOString();
      await apiPost('createSchedule',payload);
    }else{
      await apiPost('createWalkin',payload);
    }
    ['fPol','fSupir','fSJ','fCatatan'].forEach(function(id){$(id).value='';});
    toast('Truk tersimpan ✅','ok');
    S.tab='queue';renderAll();
    await refreshData(true);
  }catch(e){
    if(authFail(e.message)){forceLogout(e.message.replace('AUTH: ',''));return;}
    toast(e.message,'err',function(){submitTruck();});
  }finally{S.busy=false;btn.disabled=false;}
}

/* ================= MONITOR DESKTOP ================= */
function renderMonitor(){
  var tv=todayVisits();
  var st=computeStats(tv);
  $('monStats').innerHTML=statsHtml(statCards(st));
  var cols=[{t:'Dijadwalkan',ic:'📅'},{t:'Tiba',ic:'🚚'},{t:'Sedang Bongkar',ic:'⚙️'},{t:'Selesai',ic:'✅'}];
  var parah=Number(S.settings['threshold_telat_parah_menit'])||60;
  $('kanban').innerHTML=cols.map(function(c){
    var arr=tv.filter(function(v){return v.status===c.t;}).sort(function(a,b){return (a.dock||99)-(b.dock||99);});
    return '<div class="kcol"><div class="kh"><span>'+c.ic+' '+c.t+'</span><span>'+arr.length+'</span></div>'+
      arr.map(function(v){
        var cls=c.t==='Tiba'?'c1':c.t==='Sedang Bongkar'?'c2':'c3';
        var t='',hot=false;
        if(c.t==='Tiba'&&v.aktual_tiba){var w=minsSince(v.aktual_tiba,nowMs());t='Menunggu '+durStr(w);if(w>=parah){hot=true;t='⚠️ '+t;}}
        else if(c.t==='Sedang Bongkar'&&v.mulai_bongkar){t='Bongkar '+durStr(runningBongkarMin(v))+(v.break_start&&!v.break_end?' ☕':'');}
        else if(c.t==='Dijadwalkan'&&v.plan_tiba){var df=Math.round((nowMsOf(v.plan_tiba)-nowMs())/60000);t=df>0?('Plan '+durStr(df)+' lagi'):('Telat '+durStr(-df));if(df<-30){hot=true;}}
        else if(c.t==='Selesai'){t='T'+durStr(v.durasi_tunggu_menit)+' B'+durStr(v.durasi_bongkar_menit);}
        return '<div class="kcard '+cls+(hot?' late':'')+'"><div class="p">'+esc(v.no_polisi||'-')+(v.dock?' <small style="color:var(--work)">D'+v.dock+'</small>':'')+'</div>'+
          '<div class="s">'+esc(v.vendor||'')+'</div><div class="t'+(hot?' hot':'')+'">'+esc(t)+'</div>'+
          '<div class="ops">'+esc((v.operator_tiba?'T:'+v.operator_tiba:'')+(v.operator_bongkar?(v.operator_tiba?' · ':'')+'B:'+v.operator_bongkar:''))+'</div></div>';
      }).join('')||'<div class="empty">Kosong</div>'+'</div>';
  }).join('');
  var f=S.fMon=readFilters('mDate','mVendor','mStatus');
  var isDefault=(!f.date||f.date===todayJak())&&!f.vendor&&!f.status;
  var list=isDefault?todayVisits():applyFilters(S.visits,f);
  S.monList=list;
  $('monTbl').innerHTML=tableHtml(list.slice().sort(byCreated).slice(0,300));
  $('lastUpd').textContent=jktTime(S.lastUpdate||nowMs());
}

      S.fDash={date:$('dDate').value,vendor:$('dVendor').value,status:$('dStatus').value};

  $('btnCsv').onclick=function(){

  // filter monitor

    });
  });

    csvExport(S.monList||applyFilters(S.visits,S.fMon),'unloading_monitor_'+(S.fMon.date||todayJak())+'.csv');

    b.onclick=function(){S.adminTab=b.getAttribute('data-a');renderAdminTab(S.adminTab);};
  });

  // prefill login
  $('inUrl').value=localStorage.getItem(LS.URL)||'';
  $('inUser').value=localStorage.getItem(LS.USER)||'';
  $('dDate').value=todayJak(); $('mDate').value=todayJak();
  window.addEventListener('online',function(){$('connDot').className='dot';if(S.me)refreshData(false);});
  window.addEventListener('offline',function(){$('connDot').className='dot off';});
}
